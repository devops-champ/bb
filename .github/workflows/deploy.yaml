name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  IMAGE_NAME: backstage2026/liquibase

jobs:

################################################################################
# Stage 1 - Version
################################################################################

  version:
    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.version.outputs.current_version }}
      next_version: ${{ steps.version.outputs.next_version }}

    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Read Version
        id: version
        run: |

          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          VERSION=${VERSION/-SNAPSHOT/}

          echo "Current Version: $VERSION"

          IFS='.' read MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH+1))

          NEXT_VERSION=$MAJOR.$MINOR.$PATCH

          echo "Next Version: $NEXT_VERSION"

          echo "current_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

################################################################################
# Stage 2 - Update Pom
################################################################################

  update-pom:

    needs: version

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Update Version
        run: |

          mvn versions:set \
            -DnewVersion=${{ needs.version.outputs.next_version }}

          mvn versions:commit

      - uses: actions/upload-artifact@v4
        with:
          name: updated-pom
          path: pom.xml

################################################################################
# Stage 3 - Build
################################################################################

  build:

    needs:
      - version
      - update-pom

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: updated-pom

      - uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Build Project
        run: |

          mvn clean package -B

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            target/**
            Dockerfile
            pom.xml

################################################################################
# Stage 4 - Docker Build
################################################################################

  docker-build:

    needs:
      - version
      - build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Build Image
        run: |

          docker build \
            -t ${IMAGE_NAME}:${{ needs.version.outputs.next_version }} \
            .

      - name: Save Docker Image
        run: |

          docker save \
            ${IMAGE_NAME}:${{ needs.version.outputs.next_version }} \
            -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

################################################################################
# Stage 5 - Docker Push
################################################################################

  docker-push:

    needs:
      - version
      - docker-build

    runs-on: ubuntu-latest

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: |

          docker load -i image.tar

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_1 }}
          password: ${{ secrets.DOCKERHUB_TOKEN_1 }}

      - name: Push Image
        run: |

          docker push \
            ${IMAGE_NAME}:${{ needs.version.outputs.next_version }}

################################################################################
# Stage 6 - Commit Version
################################################################################

  commit-version:

    needs:
      - version
      - docker-push

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: updated-pom

      - name: Commit Version
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add pom.xml

          git commit \
            -m "Release ${{ needs.version.outputs.next_version }}" \
            || echo "Nothing to commit"

      - name: Push Commit
        run: |

          git push origin main

################################################################################
# Stage 7 - Create Tag
################################################################################

  create-tag:

    needs:
      - version
      - commit-version

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git fetch --tags

          git tag \
            v${{ needs.version.outputs.next_version }}

          git push origin \
            v${{ needs.version.outputs.next_version }}

################################################################################
# Stage 8 - Complete
################################################################################

  completed:

    needs:
      - create-tag

    runs-on: ubuntu-latest

    steps:

      - name: Deployment Summary
        run: |
          echo "Deployment completed successfully."
          echo "Version : ${{ needs.version.outputs.next_version }}"
          echo "Image   : ${IMAGE_NAME}:${{ needs.version.outputs.next_version }}"
