name: Liquibase PostgreSQL Review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APPLICATION: liquibase-postgresql

jobs:
  review:
    name: Liquibase Review Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: backstage
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d backstage"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      ##########################################################################
      # Stage 1 - Checkout
      ##########################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ##########################################################################
      # Stage 2 - Build
      ##########################################################################

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build Maven Project
        run: |
          mvn clean package -B

      - name: Get Project Version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "ARTIFACT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Inspect Build
        run: |
          ls -R target

      ##########################################################################
      # Stage 3 - Prepare Docker Context
      ##########################################################################

      - name: Extract Liquibase Package
        run: |
          mkdir docker-context

          tar -xzf target/liquibase-postgresql-${ARTIFACT_VERSION}-liquibase.tar.gz \
            -C docker-context

      - name: Prepare Docker Files
        run: |

          cp -r docker-context/liquibase-postgresql-${ARTIFACT_VERSION}/changelog .
          cp docker-context/liquibase-postgresql-${ARTIFACT_VERSION}/liquibase.properties .
          cp docker-context/liquibase-postgresql-${ARTIFACT_VERSION}/docker/entrypoint.sh .

      - name: Verify Docker Context
        run: |
          find .
          ls -R changelog

      ##########################################################################
      # Stage 4 - Build Docker Image
      ##########################################################################

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          no-cache: true
          tags: liquibase-review:${{ github.run_number }}

      - name: Verify Docker Image
        run: |
          docker images

      - name: Inspect Image
        run: |
          docker run --rm \
            --entrypoint sh \
            liquibase-review:${{ github.run_number }} \
            -c "ls -R /liquibase"

      ##########################################################################
      # Stage 5 - PostgreSQL
      ##########################################################################

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres
          do
            echo "Waiting..."
            sleep 2
          done

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d backstage \
            -c "SELECT version();"

      ##########################################################################
      # Stage 6 - Liquibase Validation
      ##########################################################################

      - name: Validate Changelog
        run: |
          docker run --rm --network host \
            liquibase-review:${{ github.run_number }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            validate

      ##########################################################################
      # Stage 7 - Apply Base Schema
      ##########################################################################

      - name: Apply Changelog
        run: |
          docker run --rm --network host \
            liquibase-review:${{ github.run_number }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            update

      ##########################################################################
      # Stage 8 - Tag Baseline
      ##########################################################################

      - name: Tag Baseline
        run: |
          docker run --rm --network host \
            liquibase-review:${{ github.run_number }} \
            --changeLogFile=changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            tag review-baseline

      ##########################################################################
      # Stage 9 - Checkout Main Branch
      ##########################################################################

      - name: Checkout Main Worktree
        run: |
          git fetch origin main
          git worktree add /tmp/main origin/main

          ls -la /tmp/main

      ##########################################################################
      # Stage 10 - Apply Main Branch Changelog
      ##########################################################################

      - name: Validate Main
        run: |
          docker run --rm --network host \
            -v /tmp/main:/workspace \
            liquibase-review:${{ github.run_number }} \
            --changeLogFile=/workspace/changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            validate

      - name: Update Main
        run: |
          docker run --rm --network host \
            -v /tmp/main:/workspace \
            liquibase-review:${{ github.run_number }} \
            --changeLogFile=/workspace/changelog/db.changelog-master.xml \
            --url=jdbc:postgresql://localhost:5432/backstage \
            --username=postgres \
            --password=postgres \
            update

      ##########################################################################
      # Stage 11 - Success
      ##########################################################################

      - name: Pipeline Complete
        run: |
          echo "======================================="
          echo "Liquibase Review Completed Successfully"
          echo "======================================="
